[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papermcp"
version = "0.1.0"
description = "Three MCP tools for finding, fetching, and questioning research papers"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.12,<4", "httpx>=0.28,<1", "defusedxml>=0.7,<1", "pypdf>=6,<7", "chromadb>=1.1,<2"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2"]
dev = ["pytest>=8,<10", "pytest-httpx>=0.35,<1"]

[project.scripts]
papermcp = "papermcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
